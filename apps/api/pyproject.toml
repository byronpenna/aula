[project]
name = "aula-api"
version = "0.1.0"
description = "API de la plataforma escolar Aula Virtual (FastAPI + Lambda/Mangum)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "mangum==0.19.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # Pin explícito: passlib 1.7.4 no reconoce el módulo `bcrypt` >=4.1 (falla al
    # leer __about__.__version__). Ver https://github.com/pyca/bcrypt/issues/684.
    "bcrypt==4.0.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "boto3==1.35.90",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (llamada en valor por defecto) es el patrón estándar de FastAPI (Depends(...));
# no es un bug en este contexto.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
